<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8b5a2b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lembah Kenanga — Matematika SMA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/homepage/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #1a1410; overflow: hidden; overscroll-behavior: none; }
    body { display: flex; align-items: center; justify-content: center; font-family: "VT323", monospace; color: #f5e6c8; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; outline: none; display: block; touch-action: none; }
    #loading { position: absolute; font-size: 24px; letter-spacing: 1px; text-align: center; padding: 0 20px; }
    #home { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 8px; font-size: 16px; color: #d9c39a; text-decoration: none; opacity: .7; z-index: 30; background: rgba(0,0,0,.35); padding: 4px 10px; border-radius: 8px; }
    #home:hover { opacity: 1; }
    /* font warm-up so canvas measureText sees the loaded faces */
    .warm { position: absolute; opacity: 0; pointer-events: none; }
    #rotate-hint { display: none; position: fixed; inset: 0; z-index: 40; background: rgba(26,20,16,.92); color: #f5e6c8;
      font-size: 22px; text-align: center; padding: 40px 24px; }
    @media (orientation: portrait) and (max-width: 760px) {
      #rotate-hint { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
    }
  </style>
</head>
<body>
  <span class="warm" style="font-family:'Press Start 2P'">.</span><span class="warm" style="font-family:'VT323'">.</span>
  <div id="loading">Memuat…</div>
  <canvas id="game" tabindex="0"></canvas>
  <a id="home" href="index.html">← Menu</a>
  <div id="rotate-hint">
    <div style="font-size:44px">🔄</div>
    <div>Putar HP-mu ke mode <b>landscape</b> (tidur)<br>agar game lebih nyaman dimainkan.</div>
    <div style="font-size:16px;opacity:.7">Tetap bisa main portrait — joystick ada di kiri bawah.</div>
  </div>
  <script type="module" src="src/main.js"></script>
  <script>
    // Service worker (PWA): game bisa dibuka offline setelah sekali dimuat.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
